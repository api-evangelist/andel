name: Andel
description: >-
  Andel is a cooperative marketplace for drug affordability that unlocks direct
  manufacturer pricing on high-spend specialty medications, connecting health
  plans, PBMs, and members without rebates, spreads, or intermediaries across
  neurology, immunology, dermatology, oncology, fertility, cardiometabolic, and
  rare/orphan therapeutic areas. Its Data Exchange API provides real-time,
  RFC 9457-compliant interchange of member purchase events between Andel and
  counterparty plans or PBMs, with OAuth 2.0 machine-to-machine authentication
  via Descope, per-plan authorization, cursor pagination, purchase.created
  webhooks, and Express Scripts (ESI) CDH accumulator-format compatibility.
